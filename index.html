    0 22px 40px rgba(61,43,31,.3);

.title-menu .logo{

}

}
.title-menu .foot{
  font-size:12px; color:var(--faint); margin-top:4px;
}

/* ---- Dense dashboard ---- */
.dash-grid{
  display:grid;
  grid-template-columns: 1.1fr 1fr;
  grid-template-rows: auto auto 1fr;
  gap:12px;
  flex:1; min-height:0;
}
.dash-grid .span2{ grid-column:1 / -1; }
.dash-card{
  background: linear-gradient(180deg, #fffef8, var(--paper2));
  border:3px solid var(--wood-light);
  border-radius: var(--r-s);
  padding:12px 14px;
  box-shadow: 0 3px 0 rgba(139,94,60,.1);
  display:flex; flex-direction:column; gap:8px; min-height:0;
}
.dash-card h3{
  margin:0; font:700 13px var(--display); letter-spacing:.06em;
  text-transform:uppercase; color:var(--wood2);
}
.dash-actions{ display:flex; flex-wrap:wrap; gap:8px; }
.dash-film-row{
  display:flex; align-items:center; gap:10px; padding:8px 10px;
  background:#fffef8; border:2px solid var(--wood-light); border-radius:10px;
}
.dash-film-list{ flex:1; min-height:0; overflow:auto; }
@media (max-width:720px){
  .dash-grid{ grid-template-columns:1fr; }
}

@media (max-width:900px){
  .nav-tab{ font-size:12px; padding:0 8px; height:34px; border-width:2px; }

@media (max-width:520px){

  .closebox{ width:30px; height:30px; }
}


.tone-row{ display:flex; flex-direction:column; gap:6px; padding:8px 0; border-bottom:1px solid rgba(139,94,60,.15); }

.nav-tab{ position:relative; }

}

  padding:12px 14px; border-bottom:1px solid rgba(139,94,60,.15);
}
.review-card:last-child{ border-bottom:0; }

<title>Cinema Deluxe</title>

<style>
/* ============================================================
   Cinema Deluxe — Harvest Moon / Story of Seasons restyle
   Soft framed menus · dialogue boxes · cozy 2D farmhouse feel
   ============================================================ */
:root{
  --sky1:#a8d4f0; --sky2:#cfe8f5; --field:#b8d47a; --field2:#8fbc5a;
  --wood:#8b5e3c; --wood2:#6d4c2f; --wood-light:#c4a574;
  --paper:#fff8e7; --paper2:#f5edd8; --ink:#3d2b1f; --muted:#7a6a55; --faint:#a89b82;
  --accent:#e8a838; --accent2:#f0c14a; --accent-ink:#3d2b1f;
  --good:#5a9e3f; --bad:#d45a4a; --info:#4a8fc2;
  --rose:#e07a5f; --cream:#fffaf0;
  --r:18px; --r-s:12px;
  --display:"Fredoka","Comic Sans MS","Chalkboard SE",sans-serif;
  --text:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:15px/1.45 var(--text); color:var(--ink);
  background:
    linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 38%, #e8f5c8 55%, var(--field) 78%, var(--field2) 100%);
  overflow:hidden; -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
img.px{image-rendering:pixelated}
img.art{image-rendering:auto;display:block;width:100%;height:auto}

/* ---- soft sky decorations ---- */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 180px 70px at 15% 12%, rgba(255,255,255,.55), transparent 70%),
    radial-gradient(ellipse 220px 80px at 75% 8%, rgba(255,255,255,.45), transparent 70%),
    radial-gradient(ellipse 140px 50px at 50% 18%, rgba(255,255,255,.35), transparent 70%);
}

/* ---- top banner (wooden sign) ---- */
#menubar{
  position:fixed; top:0; left:0; right:0; z-index:1000;
  height:64px; margin-top:env(safe-area-inset-top,0px);
  padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));
  display:flex; align-items:center; gap:10px;
  background: linear-gradient(180deg, #c9a06a 0%, var(--wood) 40%, var(--wood2) 100%);
  border-bottom:4px solid #4a3420;
  box-shadow: 0 4px 0 #3a2818, 0 8px 20px rgba(61,43,31,.25);
  user-select:none;
}
.brand{
  font:700 22px/1 var(--display); color:#fff8e0;
  text-shadow: 2px 2px 0 #4a3420, 0 0 12px rgba(255,220,120,.35);
  letter-spacing:.02em; white-space:nowrap; cursor:pointer; margin-right:8px;
}
.brand:hover{ filter:brightness(1.08) }
.nav-tabs{ display:none; gap:6px; flex:1; min-width:0; overflow:hidden; align-items:flex-end; height:100%; padding-top:8px; }
body.in-game .nav-tabs{ display:flex; }
.nav-tab{
  display:inline-flex; align-items:center; gap:6px;
  height:40px; padding:0 14px; border-radius:12px 12px 0 0;
  border:3px solid #4a3420; border-bottom:0;
  background: linear-gradient(180deg, #e8d5a8, #c9a06a);
  font:600 14px var(--display); color:var(--ink);
  cursor:pointer; white-space:nowrap;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35);
  transition: transform .1s, filter .1s;
}
.nav-tab:hover{ filter:brightness(1.06) }
.nav-tab.active{
  background: linear-gradient(180deg, var(--paper), var(--paper2));
  transform: translateY(2px);
  box-shadow: inset 0 2px 0 #fff, 0 -2px 0 var(--accent);
}
.nav-tab:disabled{ opacity:.4; cursor:default; filter:none }
#clock{ margin-left:auto; display:flex; align-items:center; gap:8px }
#clock .dt{
  font:600 14px var(--display); padding:6px 14px;
  background:var(--paper); border:3px solid #4a3420; border-radius:999px;
  color:var(--wood2); box-shadow: inset 0 1px 0 #fff, 2px 2px 0 rgba(0,0,0,.15);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
#clock .dt:empty{display:none}
#clock .snd{
  width:40px; height:40px; border-radius:12px; border:3px solid #4a3420;
  background: linear-gradient(180deg, #e8d5a8, #c9a06a);
  display:grid; place-items:center; cursor:pointer; color:var(--ink);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 2px 2px 0 rgba(0,0,0,.15);
}
#clock .snd:hover{ filter:brightness(1.06) }
#clock .snd.off{ opacity:.5 }
.vol{display:flex;align-items:center;gap:4px}
#volume{
  --p:80%; -webkit-appearance:none; appearance:none; width:88px; height:10px; border-radius:999px; cursor:pointer;
  background:linear-gradient(90deg,var(--accent) var(--p), #5a4030 var(--p));
  border:2px solid #4a3420; outline-offset:4px;
}
#volume::-webkit-slider-thumb{
  -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
  background:var(--accent2); border:3px solid #4a3420; box-shadow:0 2px 0 rgba(0,0,0,.2);
}
#volume::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%; background:var(--accent2); border:3px solid #4a3420;
}

/* ---- main stage ---- */
#desk{
  position:fixed;
  inset: calc(64px + env(safe-area-inset-top,0px)) 0 0 0;
  padding: 12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));
  display:flex; flex-direction:column; gap:0;
  z-index:1; overflow:hidden;
}
/* Title screen: no window chrome, full-bleed menu */
body.title-mode #desk{ padding:0; }
body.title-mode .win[data-id="main"]{
  border:0; border-radius:0; box-shadow:none; background:transparent;
}
body.title-mode .win[data-id="main"] .titlebar,
body.title-mode .win[data-id="main"] .tbar{ display:none !important; }
body.title-mode .win[data-id="main"] .pane{
  padding:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
}

#trash{display:none}

/* single focused screen */
.win{
  flex:1; min-height:0; display:none; flex-direction:column;
  background: var(--paper);
  border: 5px solid var(--wood);
  border-radius: var(--r);
  box-shadow:
    inset 0 0 0 3px var(--wood-light),
    0 8px 0 #4a3420,
    0 14px 28px rgba(61,43,31,.28);
  overflow:hidden;
}
.win:not([hidden]){ display:flex !important; }
.win[hidden]{ display:none !important; }

/* title bar as wooden plank */
.titlebar{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:10px 16px 8px;
  background: linear-gradient(180deg, #c9a06a, var(--wood));
  border-bottom:4px solid #4a3420;
}
.ttl{
  font:700 20px/1.15 var(--display); color:#fff8e0;
  text-shadow: 1px 1px 0 #4a3420; letter-spacing:.01em;
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
}
.closebox{
  order:2; width:34px; height:34px; border-radius:10px; border:3px solid #4a3420;
  background: linear-gradient(180deg, #f0c14a, #e07a5f); color:#fff; font-size:20px; line-height:1;
  cursor:pointer; display:grid; place-items:center;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 2px 2px 0 rgba(0,0,0,.2);
}
.closebox::before{content:"×"}
.closebox:hover{ filter:brightness(1.08) }

.wbody{ flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; background:var(--paper); }
.pane{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:10px; min-height:0; flex:1; overflow:hidden; }
body:not(.title-mode) .win[data-id="movie"] .pane,
body:not(.title-mode) .win[data-id="top"] .pane{ overflow:auto; }

/* action bar — soft wooden buttons */
.tbar{
  display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px;
  background: linear-gradient(180deg, var(--paper2), #ebe0c4);
  border-bottom:3px solid var(--wood-light);
}
.tbtn{
  display:inline-flex; align-items:center; gap:7px;
  height:40px; padding:0 14px; border-radius:12px;
  border:3px solid #4a3420;
  background: linear-gradient(180deg, #fff8e0, #e8d5a8);
  font:600 14px var(--display); color:var(--ink);
  cursor:pointer; white-space:nowrap;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 3px 0 #5a4030;
  transition: transform .08s, filter .1s;
}
.tbtn:hover:not(:disabled){ filter:brightness(1.05) }
.tbtn:active:not(:disabled){ transform:translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 1px 0 #5a4030; }
.tbtn.primary{
  background: linear-gradient(180deg, #ffe08a, var(--accent));
  color:var(--accent-ink);
}
.tbtn.danger{
  background: linear-gradient(180deg, #f5b0a0, var(--rose));
  color:#fff;
}
.tbtn:disabled{ opacity:.4; cursor:default; filter:none }
.tbtn .ico{ width:18px; height:18px }

/* labels, stats, lists */
.lbl{
  font:700 12px var(--display); letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
}
.kv{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; align-items:baseline }
.kv>b{ white-space:nowrap; font-weight:600; color:var(--muted) }
.kv>span{ min-width:0; overflow-wrap:anywhere; font-weight:500 }
.row{ display:flex; gap:12px; flex-wrap:wrap }
.row>*{ min-width:0 }
.col{ display:flex; flex-direction:column; gap:10px; min-width:0; flex:1 }
.num{ font-variant-numeric:tabular-nums }
.good{ color:var(--good)!important } .bad{ color:var(--bad)!important }
.inset{
  background:var(--paper2); border:3px solid var(--wood-light); border-radius:var(--r-s);
}

/* lists — soft notice-board style */
.list{
  background:#fffef8; border:3px solid var(--wood-light); border-radius:var(--r-s);
  overflow:auto; min-height:70px;
  box-shadow: inset 0 2px 6px rgba(61,43,31,.06);
}
.list table{ border-collapse:collapse; width:100% }
.list td{ padding:9px 12px; white-space:nowrap; border-bottom:1px solid rgba(139,94,60,.15); cursor:default }
.list tr:last-child td{ border-bottom:0 }
.list td.wrap{ white-space:normal }
.list tr[tabindex]:hover td{ background:#f5edd0 }
.list tr.sel td{ background:rgba(232,168,56,.22); color:var(--wood2) }
.list tr.sel td:first-child{ box-shadow:inset 4px 0 0 var(--accent) }
.list tr.dim td{ color:var(--faint) }
.list tr.me td{ color:var(--wood2); font-weight:700 }
.list tr.sep td{
  color:var(--wood); font:700 12px var(--display); letter-spacing:.06em; text-transform:uppercase;
  padding-top:14px; background:transparent; border-bottom:0;
}
.list tr:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px }
.colhead{
  display:grid; font:700 11px var(--display); letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); padding:0 12px;
}

/* message / dialogue box — classic HM style */
.msgs td{ white-space:normal; display:flex; gap:10px; align-items:flex-start; line-height:1.4 }
.msgs tr.sep td{ display:table-cell }
.msgbox{
  flex:1; min-height:200px; max-height:min(50vh,520px); overscroll-behavior:contain;
  background: #fffef8;
  border: 4px solid var(--wood);
  border-radius: 16px;
  box-shadow: inset 0 0 0 2px var(--wood-light), 0 4px 0 rgba(74,52,32,.2);
}
.msgs tr.new td{ background:rgba(232,168,56,.1) }
.msgs tr.sep.latest td{ color:var(--wood2) }
.msgs .ico.big{ width:20px; height:20px; padding:0; background:none; border-radius:0 }

.rank{ color:var(--faint) }

/* progress bars — soft filled bars */
.bar{
  height:14px; border-radius:999px; background:#e8dcc0;
  border:2px solid var(--wood); position:relative; overflow:hidden;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.08);
}
.bar i{
  position:absolute; inset:0 auto 0 0; border-radius:999px;
  background: linear-gradient(90deg, #7bc55a, #a8e06a);
  transition:width .5s ease;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.4);
}
.stage{ display:grid; grid-template-columns:minmax(0,11em) 1fr 3.4em; gap:10px; align-items:center }
.stage span:last-child{ text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); font-weight:600 }

.stat{
  display:flex; flex-direction:column; gap:2px; padding:12px 14px;
  border:3px solid var(--wood-light); border-radius:var(--r-s);
  background: linear-gradient(180deg, #fffef8, var(--paper2));
  min-width:0;
  box-shadow: 0 3px 0 rgba(139,94,60,.12);
}
.stat .v{ font:700 22px/1.15 var(--display); font-variant-numeric:tabular-nums }
.stat .k{ font:700 11px var(--display); color:var(--muted); letter-spacing:.04em; text-transform:uppercase }
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px }

/* buttons & fields */
.btn{
  min-width:90px; height:40px; padding:0 16px;
  border:3px solid #4a3420; border-radius:12px;
  background: linear-gradient(180deg, #fff8e0, #e8d5a8);
  font:600 14px var(--display); cursor:pointer; white-space:nowrap;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 3px 0 #5a4030;
}
.btn:hover:not(:disabled){ filter:brightness(1.05) }
.btn:active:not(:disabled){ transform:translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 1px 0 #5a4030 }
.btn:disabled{ opacity:.4; cursor:default }
.btn.def{
  background: linear-gradient(180deg, #ffe08a, var(--accent));
  color:var(--accent-ink);
}
.fld{
  border:3px solid var(--wood-light); background:#fffef8; border-radius:10px;
  padding:9px 12px; min-width:0; width:100%;
  box-shadow: inset 0 2px 4px rgba(61,43,31,.06);
}
.fld:focus{ border-color:var(--accent); outline:none }
select.fld{ width:auto }
textarea.fld{ resize:vertical }
label.chk{ display:flex; align-items:center; gap:8px; cursor:pointer; padding:3px 0 }
label.chk input{ margin:0; width:18px; height:18px; accent-color:var(--accent) }

/* dialogs — framed menu boards */
.overlay{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  padding: calc(20px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 20px max(12px,env(safe-area-inset-left,0px));
  background: rgba(61,43,31,.4); backdrop-filter:blur(4px);
  animation:fade .14s ease-out; z-index:3000;
}
.overlay.nested{ background:rgba(61,43,31,.25) }
.dlg{
  background: var(--paper);
  border: 5px solid var(--wood);
  border-radius: 20px;
  box-shadow:
    inset 0 0 0 3px var(--wood-light),
    0 10px 0 #4a3420,
    0 20px 40px rgba(61,43,31,.35);
  width:min(100%,calc(var(--w,420px) * 1.15));
  max-height:100%; display:flex; flex-direction:column;
  animation:pop .16s ease-out;
}
.dbody{ padding:20px 22px; display:flex; flex-direction:column; gap:14px; overflow:auto }
.dhead{ display:flex; gap:12px; align-items:center; flex-wrap:wrap }
.dhead h2{ font:700 22px/1.2 var(--display); margin:0; text-wrap:balance; color:var(--wood2) }
.dmsg{ display:flex; gap:14px; align-items:flex-start }
.dmsg p{ margin:0; flex:1; min-width:0; font-size:16px; line-height:1.5; padding-top:4px }
.dbtns{ display:flex; justify-content:flex-end; flex-wrap:wrap; gap:10px; padding-top:4px }
.dbtns .left{ margin-right:auto }
.errline{ display:flex; gap:8px; align-items:center; min-height:22px; color:var(--bad); font-weight:700 }
fieldset{
  border:3px solid var(--wood-light); border-radius:var(--r-s); margin:0; padding:10px 14px 12px; min-width:0;
  background: rgba(255,254,248,.6);
}
legend{
  font:700 11px var(--display); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:0 6px;
}
.grid3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px }
.grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 14px }
.picbox{
  border-radius:14px; overflow:hidden; line-height:0; align-self:center; max-width:100%;
  border:4px solid var(--wood); box-shadow: 0 4px 0 rgba(74,52,32,.2);
}
.thumbs{ display:grid; grid-template-columns:auto auto 1fr; gap:8px 10px; align-items:center }

/* hero panel on main screen */
.hero{
  display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:18px; align-items:center;
  padding:12px; background: linear-gradient(135deg, #fffef8, #f0f5d8);
  border:3px solid var(--wood-light); border-radius:var(--r);
}
.hero h1{
  font:700 32px/1.05 var(--display); color:var(--wood2); margin:0 0 8px;
  text-shadow: 1px 1px 0 #fff;
}
.hero p{ margin:0; color:var(--muted) }
.mtitle-lg{ font:700 24px/1.1 var(--display); margin:0; color:var(--wood2) }
.tagline{ font-style:italic; color:var(--muted) }

/* icons */
.ico{ display:inline-flex; width:18px; height:18px; flex:none; vertical-align:-4px }
.ico svg{ width:100%; height:100% }
.ico.up{color:var(--good)} .ico.down{color:var(--bad)} .ico.exec{color:var(--accent)}
.ico.money{color:var(--accent)} .ico.film{color:var(--info)} .ico.note{color:var(--muted)}
.ico.thumbup{color:var(--good)} .ico.thumbdown{color:var(--bad)} .ico.warn{color:var(--bad)}
.ico.big{
  width:36px; height:36px; padding:6px; border-radius:12px;
  background: linear-gradient(180deg, #fff8e0, #e8d5a8);
  border:2px solid var(--wood); color:var(--wood2);
}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}

/* responsive */
@media (max-width:900px){
  body:not(.title-mode){ overflow:auto }
  body.title-mode{ overflow:hidden }
  #desk{ position:static; min-height:calc(100% - 64px); padding-top:12px }
  body.title-mode #desk{ position:fixed; inset:calc(64px + env(safe-area-inset-top,0px)) 0 0 0; padding:0; }
  .win{ min-height:0 }
  .wbody{ overflow:visible }
  .list{ max-height:300px }
  .hero{ grid-template-columns:1fr }
  .grid3{ grid-template-columns:1fr }
  .brand{ font-size:18px }
  .nav-tab{ font-size:13px; padding:0 10px; height:36px }
}
@media (max-width:520px){
  .brand{ display:none }
  #volume{ width:56px }
  #clock .dt{ padding:5px 10px; font-size:12px }
}
.win{ container-type:inline-size }
@container (max-width:520px){
  .hero{ grid-template-columns:90px 1fr; gap:12px; align-items:start }
  .hero h1{ font-size:20px; margin-bottom:4px }
  .hero p{ font-size:13px }
  .tbtn{ height:36px; padding:0 10px; font-size:13px }
  .mtitle-lg{ font-size:20px }
}
@container (max-width:720px){ .msgcol{ order:-1 } .msgbox{ max-height:280px } }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important } }

/* ---- Stardew / HM64 title menu ---- */
.title-menu{
  width:min(420px, 92vw);
  display:flex; flex-direction:column; align-items:center; gap:18px;
  padding:28px 24px 32px;
  background: var(--paper);
  border: 5px solid var(--wood);
  border-radius: 22px;
  box-shadow:
    inset 0 0 0 3px var(--wood-light),
    0 10px 0 #4a3420,
    0 22px 40px rgba(61,43,31,.3);
  text-align:center;
}
.title-menu .logo{
  font:700 40px/1.05 var(--display); color:var(--wood2);
  text-shadow: 2px 2px 0 #fff, 3px 3px 0 var(--wood-light);
  margin:0;
}
.title-menu .tag{
  margin:-6px 0 4px; color:var(--muted); font-size:15px; font-style:italic;
}
.title-menu .menu-btns{
  display:flex; flex-direction:column; gap:10px; width:100%; max-width:260px;
}
.title-menu .menu-btns .btn{
  width:100%; height:48px; font-size:18px; border-radius:14px;
}
.title-menu .art-slot{
  width:100%; max-width:280px; border-radius:14px; overflow:hidden;
  border:4px solid var(--wood); line-height:0;
  box-shadow: 0 4px 0 rgba(74,52,32,.2);
}
.title-menu .foot{
  font-size:12px; color:var(--faint); margin-top:4px;
}

/* ---- Dense dashboard ---- */
.dash-grid{
  display:grid;
  grid-template-columns: 1.1fr 1fr;
  grid-template-rows: auto auto 1fr;
  gap:12px;
  flex:1; min-height:0;
}
.dash-grid .span2{ grid-column:1 / -1; }
.dash-card{
  background: linear-gradient(180deg, #fffef8, var(--paper2));
  border:3px solid var(--wood-light);
  border-radius: var(--r-s);
  padding:12px 14px;
  box-shadow: 0 3px 0 rgba(139,94,60,.1);
  display:flex; flex-direction:column; gap:8px; min-height:0;
}
.dash-card h3{
  margin:0; font:700 13px var(--display); letter-spacing:.06em;
  text-transform:uppercase; color:var(--wood2);
}
.dash-actions{ display:flex; flex-wrap:wrap; gap:8px; }
.dash-film-row{
  display:flex; align-items:center; gap:10px; padding:8px 10px;
  background:#fffef8; border:2px solid var(--wood-light); border-radius:10px;
}
.dash-film-list{ flex:1; min-height:0; overflow:auto; }
@media (max-width:720px){
  .dash-grid{ grid-template-columns:1fr; }
}

  on: true, vol: 0.8, cache: {},
  ctx: null, bgmGain: null, bgmNodes: [], bgmPlaying: false, bgmWanted: true,
  play(name) {
    if (!this.on || !ASSETS["snd_" + name]) return;
    try {
      let a = this.cache[name];
      if (!a) a = this.cache[name] = new Audio(ASSETS["snd_" + name]);
      a.volume = this.vol; a.currentTime = 0; if (this.vol <= 0) return; const p = a.play(); if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  },
  ensureCtx() {
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    this.ctx = new AC();
    this.bgmGain = this.ctx.createGain();
    this.bgmGain.gain.value = 0;
    this.bgmGain.connect(this.ctx.destination);
    return this.ctx;
  },
  // Cozy pentatonic "farm evening" loop — soft triangle + light pulse
  phase: "menu", // menu | prod | release
  _bgmGen: 0,
  setPhase(ph) {
    if (this.phase === ph && this.bgmPlaying) return;
    this.phase = ph;
    this.stopBgm(true);
    if (this.bgmWanted && this.on && this.vol > 0) this.startBgm();
  },
  startBgm() {
    this.bgmWanted = true;
    if (!this.on || this.vol <= 0) return;
    const ctx = this.ensureCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    // hard stop any prior bed so rapid phase switches never stack
    this.stopBgm(true);
    // fresh gain bus for this session only
    this.bgmGain = ctx.createGain();
    this.bgmGain.gain.value = 0;
    this.bgmGain.connect(ctx.destination);
    const master = this.bgmGain;
    const phase = this.phase || "menu";
    const presets = {
      menu:    { tempo: 92, scale: [196.00, 220.00, 246.94, 293.66, 329.63, 392.00], lead: "triangle", bassMul: 0.5, bright: 0.012, leadGain: 0.045 },
      prod:    { tempo: 108, scale: [174.61, 196.00, 220.00, 261.63, 293.66, 349.23], lead: "square", bassMul: 0.45, bright: 0.008, leadGain: 0.028 },
      release: { tempo: 118, scale: [220.00, 246.94, 277.18, 329.63, 369.99, 440.00], lead: "triangle", bassMul: 0.55, bright: 0.015, leadGain: 0.038 },
      win:     { tempo: 128, scale: [261.63, 293.66, 329.63, 392.00, 440.00, 523.25], lead: "triangle", bassMul: 0.5, bright: 0.02, leadGain: 0.05 },
      lose:    { tempo: 72, scale: [146.83, 164.81, 174.61, 196.00, 220.00, 246.94], lead: "triangle", bassMul: 0.4, bright: 0.006, leadGain: 0.03 },
    };
    const P = presets[phase] || presets.menu;
    const beat = 60 / P.tempo;
    const scale = P.scale;
    const melody = phase === "win"
      ? [0,2,4,5, 4,5,4,2, 0,2,4,5, 5,4,2,0, 2,4,5,4, 2,0,2,4, 5,4,2,0, 4,2,0,2]
      : phase === "lose"
      ? [4,2,0,0, 2,1,0,0, 3,2,1,0, 2,0,1,0, 4,3,2,1, 0,1,0,0, 2,1,0,1, 0,0,1,0]
      : phase === "release"
      ? [0,2,4,5, 4,2,0,2, 1,3,5,4, 2,0,1,0, 4,5,4,2, 0,2,4,5, 3,2,1,0, 2,4,2,0]
      : phase === "prod"
      ? [0,0,2,4, 2,2,4,5, 4,2,0,1, 2,4,2,0, 1,2,4,2, 0,2,1,0, 4,2,5,4, 2,0,2,0]
      : [0,2,4,2, 5,4,2,0, 1,2,4,5, 4,2,1,0, 2,4,5,4, 2,0,1,2, 4,2,0,2, 1,0,2,0];
    const bass = [0,0,0,0, 2,2,2,2, 0,0,0,0, 4,4,2,2];
    const loopSec = melody.length * beat * 0.5;
    const gen = ++this._bgmGen;
    this.bgmNodes = [];
    let nextTime = ctx.currentTime + 0.05;
    const schedulePass = (when) => {
      if (gen !== this._bgmGen || !master) return;
      for (let i = 0; i < melody.length; i++) {
        const t = when + i * beat * 0.5;
        if (t < ctx.currentTime - 0.02) continue;
        const freq = scale[melody[i]];
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = P.lead === "square" ? "square" : "triangle";
        o.frequency.value = freq;
        const peak = P.lead === "square" ? P.leadGain * 0.55 : P.leadGain;
        g.gain.setValueAtTime(0.0001, Math.max(t, ctx.currentTime));
        g.gain.exponentialRampToValueAtTime(peak, Math.max(t, ctx.currentTime) + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + beat * 0.5);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + beat * 0.55);
        this.bgmNodes.push(o, g);
        if (i % 2 === 0) {
          const o2 = ctx.createOscillator();
          const g2 = ctx.createGain();
          o2.type = "sine";
          o2.frequency.value = freq * 2;
          g2.gain.setValueAtTime(0.0001, t + 0.04);
          g2.gain.exponentialRampToValueAtTime(P.bright, t + 0.07);
          g2.gain.exponentialRampToValueAtTime(0.0001, t + beat * 0.35);
          o2.connect(g2); g2.connect(master);
          o2.start(t + 0.04); o2.stop(t + beat * 0.4);
          this.bgmNodes.push(o2, g2);
        }
      }
      for (let i = 0; i < bass.length; i++) {
        const t = when + i * beat;
        if (t < ctx.currentTime - 0.02) continue;
        const freq = scale[bass[i]] * P.bassMul;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, Math.max(t, ctx.currentTime));
        g.gain.exponentialRampToValueAtTime(phase === "release" ? 0.055 : 0.048, Math.max(t, ctx.currentTime) + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t + beat * 0.8);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + beat * 0.85);
        this.bgmNodes.push(o, g);
      }
    };
    schedulePass(nextTime);
    nextTime += loopSec;
    this._bgmTimer = setInterval(() => {
      if (gen !== this._bgmGen || !this.bgmPlaying || !this.bgmWanted) return;
      const now = this.ctx.currentTime;
      while (nextTime < now + loopSec * 1.2) {
        schedulePass(nextTime);
        nextTime += loopSec;
      }
      if (this.bgmNodes.length > 120) this.bgmNodes = this.bgmNodes.slice(-60);
    }, Math.max(250, loopSec * 350));
    this.bgmPlaying = true;
    this._setBgmVol();
  },
  _setBgmVol() {
    if (!this.bgmGain || !this.ctx) return;
    const target = (this.on && this.bgmWanted && this.vol > 0) ? this.vol * 0.35 : 0;
    const t = this.ctx.currentTime;
    this.bgmGain.gain.cancelScheduledValues(t);
    this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value, t);
    this.bgmGain.gain.linearRampToValueAtTime(target, t + 0.4);
  },
  stopBgm(keepWanted) {
    if (!keepWanted) this.bgmWanted = false;
    this._bgmGen = (this._bgmGen || 0) + 1;
    if (this._bgmTimer) { clearInterval(this._bgmTimer); this._bgmTimer = null; }
    // kill audible output first so any already-scheduled notes go nowhere
    if (this.bgmGain) {
      try {
        const t = this.ctx ? this.ctx.currentTime : 0;
        this.bgmGain.gain.cancelScheduledValues(t);
        this.bgmGain.gain.value = 0;
        this.bgmGain.disconnect();
      } catch (e) {}
      this.bgmGain = null;
    }
    for (const n of this.bgmNodes) {
      try { if (n.stop) n.stop(0); } catch (e) {}
      try { if (n.disconnect) n.disconnect(); } catch (e) {}
    }
    this.bgmNodes = [];
    this.bgmPlaying = false;
  },

  playCheer() {
    try {
      const ctx = this.ensureCtx();
      if (!ctx || !this.on || this.vol <= 0) return;
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
      const now = ctx.currentTime;
      // layered handclap-ish noise bursts
      for (let i = 0; i < 14; i++) {
        const t = now + i * 0.07 + Math.random() * 0.03;
        const bufSize = Math.floor(ctx.sampleRate * 0.05);
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let j = 0; j < bufSize; j++) data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / bufSize, 2);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const g = ctx.createGain();
        const f = ctx.createBiquadFilter();
        f.type = "bandpass"; f.frequency.value = 1200 + Math.random() * 1800; f.Q.value = 0.7;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18 * this.vol, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
        src.connect(f); f.connect(g); g.connect(ctx.destination);
        src.start(t); src.stop(t + 0.07);
      }
      // soft "whoo" tones
      for (let i = 0; i < 5; i++) {
        const t = now + 0.15 + i * 0.12;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = 400 + i * 80 + Math.random() * 40;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.04 * this.vol, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.4);
      }
    } catch (e) {}
  },
  setMuted(m) {
    this.on = !m;
    if (this.on && this.bgmWanted) this.startBgm();
    else this._setBgmVol();
  },
  setVolume(v) {
    this.vol = v;
    // update cached SFX volumes next play; adjust bgm now
    this._setBgmVol();
    if (this.on && this.bgmWanted && v > 0 && !this.bgmPlaying) this.startBgm();
  },
};

// ---------------------------------------------------------------- persistence
// Saved companies + preferences live in the viewer's private db space; browser storage is the fallback.
const Store = {
  db: null, uid: null, ready: null,
  init() {
    this.ready = (async () => {
      try {
        if (!window.claude || !window.claude.use) return;
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (!db || !user) return;
        const id = await user.id();
        if (!id) return;
        this.db = db; this.uid = id;
      } catch (e) { this.db = null; }
    })();
    return this.ready;
  },
  ref(key) { return this.db.collection("data/users/" + this.uid).doc(key); },
  lsGet(k) { try { const v = localStorage.getItem("scdx:" + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  lsSet(k, v) { try { if (v == null) localStorage.removeItem("scdx:" + k); else localStorage.setItem("scdx:" + k, JSON.stringify(v)); } catch (e) {} },
  async get(k) {
    await this.ready;
    if (this.db) { try { const s = await this.ref(k).get(); if (s.exists) return JSON.parse(s.data().json); } catch (e) {} }
    return this.lsGet(k);
  },
  async set(k, v) {
    this.lsSet(k, v);
    await this.ready;
    if (this.db) { try { await this.ref(k).set({ json: JSON.stringify(v), at: Date.now() }); return true; } catch (e) { return false; } }
    return true;
  },
  async del(k) {
    this.lsSet(k, null);
    await this.ready;
    if (this.db) { try { await this.ref(k).delete(); } catch (e) {} }
  },
  where() { return this.db ? "your Claude account" : "this browser"; },
};

let dlgDepth = 0;

    const ov = h("div", { class: "overlay" + (dlgDepth ? " nested" : ""), style: `z-index:${3000 + dlgDepth * 10}` });
    const body = h("div", { class: "dbody" });
    const box = h("div", { class: "dlg", role: "dialog", "aria-modal": "true", "aria-label": modalLabel || title || "Dialog", style: `--w:${w}px` },
      title ? h("div", { class: "titlebar" }, h("div", { class: "ttl" }, title)) : null, body);
    ov.append(box); document.body.append(ov); dlgDepth++;
    let done = false;
    const close = v => { if (done) return; done = true; dlgDepth--; ov.remove(); resolve(v); };
    build(body, close);
    ov.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.target.matches("textarea")) { const d = box.querySelector(".btn.def:not(:disabled)"); if (d) { e.preventDefault(); d.click(); } }
      if (e.key === "Escape") { const c = box.querySelector("[data-cancel]"); if (c) { e.preventDefault(); c.click(); } }
    });
    setTimeout(() => { const f = box.querySelector("[autofocus]") || box.querySelector(".btn.def"); if (f) f.focus(); }, 0);
  });
}

function switchScreen(id) {
  if (!Wins[id]) return;
  // only allow screens that make sense
  if (id === "company" && !S.co) return;
  if (id === "movie" && !S.cur) return;
  if (id === "top" && !(S.cur && S.cur.rel)) return;
  for (const k in Wins) Wins[k].el.hidden = (k !== id);
  updateNavTabs();
  if (id === "main") renderMain();
  if (id === "company") renderCompany();
  if (id === "movie") renderMovie();
  if (id === "top") {
    if (S.cur && S.cur.rel) {
      (S.cur.rel.press || []).forEach(p => { p.unread = false; });
      S.cur.rel.unreadPress = 0;
    }
    renderTop();
  }
  updateNavTabs();
}
function updateNavTabs() {
  const inGame = !!S.co;
  document.body.classList.toggle("in-game", inGame);
  document.body.classList.toggle("title-mode", !inGame);
  const tabs = document.querySelectorAll(".nav-tab");
  tabs.forEach(t => {
    const id = t.getAttribute("data-screen");
    const active = Wins[id] && !Wins[id].el.hidden;
    t.classList.toggle("active", !!active);
    if (id === "main") { t.style.display = "none"; return; }
    if (id === "company") t.disabled = !S.co;
    else if (id === "movie") t.disabled = !S.cur;
    else if (id === "top") t.disabled = !(S.cur && S.cur.rel);
    else t.disabled = false;
    // unread reviews badge
    let badge = t.querySelector(".tab-badge");
    if (id === "top" && S.cur && S.cur.rel && (S.cur.rel.unreadPress || 0) > 0) {
      if (!badge) { badge = document.createElement("span"); badge.className = "tab-badge"; t.appendChild(badge); }
      badge.textContent = String(S.cur.rel.unreadPress);
      badge.hidden = false;
    } else if (badge) {
      badge.hidden = true;
    }
  });
}

function configureRating(m) {                         // keep player-chosen rating; soft-nudge from extreme tone mismatch
  if (m.rating == null) m.rating = 1;
  // optional: very extreme tone with a G can bump one step (still player-led)
  const heat = (m.tense|0) + (m.action|0) + (m.funny|0);
  if (m.rating === 0 && heat >= 24) m.rating = 1;
  if (m.rating <= 1 && heat >= 28) m.rating = Math.min(2, m.rating + 1);
}



function askDistributor(m, idx, state) {              // GetNewMovieDistributor: the "Ask…" button
  const c = S.co, st = c.status, n = c.movies.length;
  const last = n ? c.movies[n - 1] : null;
  const lastHit = last ? last.dom > last.budget : false;
  const S130 = DATA.firstExec, S135 = DATA.laterExec;
  let text, offer = 0;
  const g = m.genre;
  if (st === 1) {
    if (rnd(3) === 1) {
      text = S130[rnd(2) === 1 ? 0 : 1];
      offer = g === 1 ? rnd(30) + 20 : g === 2 ? rnd(30) + 5 : g === 6 ? rnd(30) + 10 : rnd(20) + 5;
    } else {
      const r = rnd(6);
      text = r === 2 ? S130[2] : r === 3 ? S130[4] : (r === 4 && lastHit) ? S135[0] : S130[3];
    }
  } else {
    if (rnd(2) === 1) {
      const r = rnd(5);
      text = (r === 2 || r === 3) ? (lastHit ? S135[0] : S135[2]) : S135[1];
      if (g === 1) offer = st > 2 ? rnd(80) + 40 : rnd(40) + 30;
      else if (g === 2) offer = rnd(40) + 10;
      else if (g === 6) offer = st > 2 ? rnd(70) + 30 : rnd(40) + 20;
      else offer = rnd(30) + 5;
    } else {
      const r = rnd(5);
      text = r === 2 ? (lastHit ? S135[3] : S135[4]) : r === 3 ? S135[6] : S135[5];
    }
  }
  state.asked[idx] = true; state.offers[idx] = offer;
  return { text, offer };
}

// ---------------------------------------------------------------- production week (PassWeekDevelopment)
function passWeekDevelopment(m) {
  const d = m.dev, c = m.cast;
  d.begged = false; d.screenedWeek = false;
  advanceDate();
  sep();
  // buzz drift
  if (rnd(2) + 1 === 1) {
    if (rnd(4) === 3 && d.good !== 0) {
      let x = rnd(3) + 1; if (d.pct === 100) x += rnd(5) + 1; if (x > d.good) x = d.good;
      msg("Your film's good buzz fell by " + x + ".", "cicn142"); d.good -= x;
    }
  } else if (rnd(4) === 2 && d.good > 0) {
    const x = rnd(3) + 1; msg("Your film's good buzz has spread by " + x + ".", "cicn143"); d.good += x;
  }
  if (d.good < 0) d.good = 0;
  if (rnd(3) + 1 !== 1) {
    if (rnd(3) !== 2 && d.bad > 0) { const x = rnd(3) + 1; msg("Your film's bad buzz has spread by " + x + ".", "cicn142"); d.bad += x; }
  } else if (rnd(4) === 3 && d.bad !== 0) {
    let x = rnd(3) + 1; if (d.pct === 100) x += rnd(5) + 1; if (x > d.bad) x = d.bad;
    msg("Your film's bad buzz fell by " + x + ".", "cicn143"); d.bad -= x;
  }
  if (d.bad < 0) d.bad = 0;
  // rating at 50%
  if (d.pct >= 50 && !d.rated) { configureRating(m); msg("Your film has been given " + RATING_MSG[m.rating], "cicn136"); d.rated = true; }
  // test screening results
  if (d.screening) {
    const r = rnd(7);
    const where = d.screening.lot ? "Test screening held on the " + DATA.distributors[m.distributor - 1] + " lot" : "Test screening held in " + d.screening.city;
    if (r === 1) { msg(where + " was extremely positive.", "cicn138"); msg("Reviews posted to the internet raised good buzz by 10.", "cicn143"); d.good += 10; }
    else if (r === 2) { msg(where + " was positive.", "cicn138"); msg("Reviews posted to the internet raised good buzz by 7.", "cicn143"); d.good += 7; }
    else if (r === 3) { msg(where + " was negative.", "cicn139"); msg("Reviews posted to the internet raised bad buzz by 10.", "cicn142"); d.bad += 10; }
    else if (r === 4) { msg(where + " was extremely negative.", "cicn139"); msg("Reviews posted to the internet raised bad buzz by 15.", "cicn142"); d.bad += 15; }
    else { msg(where + " was mixed.", "cicn136"); msg("Reviews posted to the internet raised good and bad buzz by 5 each.", "cicn136"); d.good += 5; d.bad += 5; }

async function endRun(m) {                            // HandleMouseUp end-of-run + EndSummary

  const hit = m.dom >= m.budget;
  const invested = m.companyInvested || 0;
  // company cash: add your cut; lastNet = cut minus any company cash you put in
  if (S.co.funds == null) S.co.funds = Math.max(0, S.co.income - S.co.spent);
  // income/spent still tracked for status thresholds
  // (applied below in ledger block — adjust lastNet here after cut computed)
  if (hit) { Snd.play("Money"); Snd.playCheer(); Snd.setPhase("win"); }
  else { Snd.play("Bomb"); Snd.setPhase("lose"); }

        h("div", { class: "col", style: "min-width:140px" }, h("div", { class: "dhead" }, img("cicn140"), h("h2", null, "End Summary…")),
          h("div", { style: "font-weight:bold" }, res), h("div", { class: hit ? "good" : "bad", style: "font-weight:bold" }, crit)),
        h("div", { class: "picbox" }, img(hit ? "pict135" : "pict133", "px", hit ? "The End" : "Box office bomb"))),
      h("div", { class: "list", style: "height:auto" }, h("table", null, rows.map(([k, v]) => h("tr", null, h("td", { style: "font-weight:bold" }, k.replace(/\$$/, "")), h("td", { class: "num" }, k.endsWith("$") ? "$" + v : v))))),
      h("div", { class: "dbtns" }, btn("Okay", () => close(), { def: true })));
  } });
  // company ledger
  const c = S.co;
  c.spent += m.budget - m.remaining;
  c.income += cut;
  if (c.funds == null) c.funds = Math.max(0, c.income - c.spent - cut);

  else if (c.status === 3) { if ((n > 30 && dom > 100) || (n > 20 && dom > 200)) c.status = 4; }
  c.movies.push({ title: m.title, desc: m.desc, tag: m.tag, genre: m.genre, animated: m.animated, epic: m.epic, distributor: m.distributor,
    budget: m.budget, dom: m.dom, overseas: ov, cast: m.cast, rating: m.rating, review: R.R, weeksProd: m.dev.weeksProd, weeksRel: R.weeks, ads: m.ads, released: R.released });

  renderMain(); showWin("main");
  await Store.ready;
  const p = await Store.get("prefs");
  if (p && p.cast && p.top20) {
    S.prefs = Object.assign(defaultPrefs(), p);
    if ((p.v || 1) < 2) {                             // move old saves onto the modern roster and box-office records
      const mine = p.top20.filter(r => r[2]);

  renderMain();
  const auto = await Store.get("autosave");
  if (auto && auto.co && !S.co) {
    S.co = auto.co; S.cur = auto.cur || null; S.slot = auto.slot || null; S.dirty = true;
